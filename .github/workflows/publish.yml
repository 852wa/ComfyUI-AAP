name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '852wa' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: true
      # publish-node-action@v1 bundles Node.js 20 actions. Run the same CLI
      # steps directly so checkout and setup-python can use Node.js 24.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install publishing CLI
        run: python -m pip install "comfy-cli==1.20.0"
      - name: Publish Custom Node
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
